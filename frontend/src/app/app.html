<app-navbar />
<router-outlet />

@if (auth.mostrarModalSesion()) {
  <div class="modal-fondo" role="dialog" aria-modal="true" aria-labelledby="modal-sesion-titulo">
    <div class="tarjeta modal-tarjeta">
      <h1 id="modal-sesion-titulo">Sesión por expirar</h1>
      <p class="modal-texto">
        Quedan <strong>{{ auth.segundosRestantes() | tiempoRestante }}</strong> de sesión (5 minutos antes del vencimiento). ¿Deseás extender tu sesión?
      </p>
      <div class="modal-acciones">
        <button
          type="button"
          class="boton"
          [disabled]="auth.refrescandoSesion()"
          (click)="noExtenderSesion()"
        >
          No, gracias
        </button>
        <button
          type="button"
          class="principal"
          [disabled]="auth.refrescandoSesion()"
          (click)="extenderSesion()"
        >
          {{ auth.refrescandoSesion() ? 'Extendiendo...' : 'Sí, extender sesión' }}
        </button>
      </div>
    </div>
  </div>
}

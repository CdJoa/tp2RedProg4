<nav class="navbar">
  <a class="marca" routerLink="/home">
    <img class="logo" src="logo.png" alt="" />
    Conecta2s
  </a>

  <div class="links">
    @if (auth.usuarioActual()) {
      <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
    } @else {
      <a routerLink="/login" routerLinkActive="activo">Login</a>
      <a routerLink="/registro" routerLinkActive="activo">Registro</a>
    }
  </div>

  <div class="usuario">
    @if (auth.usuarioActual(); as usuario) {
      <span>{{ usuario.nombreUsuario }}</span>
      <button (click)="cerrarSesion()">Cerrar sesión</button>
    }
  </div>
</nav>
